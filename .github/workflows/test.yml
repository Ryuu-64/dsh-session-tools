name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '24']
        dsh: ['0.2.0-rc.2', '0.2.2-rc.3']
        exclude:
          - node: '22.19.0'
            dsh: '0.2.2-rc.3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
        if: matrix.dsh == '0.2.0-rc.2'
      - run: node scripts/test-baseline.mjs ${{ matrix.dsh }}
        if: matrix.dsh == '0.2.2-rc.3'
      - run: npm install --ignore-scripts --no-audit --no-fund
        if: matrix.dsh == '0.2.2-rc.3'
      - run: npm test
      - run: node --check lib/index.js && node --check lib/client.js
