name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '24']
        dsh: ['0.1.5-rc.2', '0.1.5-rc.3', '0.1.6-alpha.1', '0.1.6-alpha.2', '0.2.0-rc.2']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - if: matrix.dsh == '0.2.0-rc.2'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - if: matrix.dsh != '0.2.0-rc.2'
        run: |
          node scripts/test-baseline.mjs ${{ matrix.dsh }}
          npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: node --check lib/index.js && node --check lib/client.js
